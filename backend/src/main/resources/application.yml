server:
  port: ${PORT:8080}

spring:
  application:
    name: it-service-desk

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:servicedesk}
    username: ${DB_USER:servicedesk}
    password: ${DB_PASSWORD:servicedesk}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 30
        order_inserts: true
        order_updates: true
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:}
      sasl.jaas.config: >-
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${KAFKA_USERNAME:}"
        password="${KAFKA_PASSWORD:}";
      ssl.truststore.certificates: ${KAFKA_CA_CERT:}
      ssl.truststore.type: PEM

    admin:
      auto-create: false

    consumer:
      group-id: it-service-desk
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

    listener:
      ack-mode: MANUAL_IMMEDIATE

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-long-random-value-in-production-min-256-bits}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  ai:
    provider: ${AI_PROVIDER:mock}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1/messages}
      timeout-ms: ${AI_TIMEOUT_MS:15000}
      max-retries: ${AI_MAX_RETRIES:2}

  remediation:
    executor: ${REMEDIATION_EXECUTOR:mock}
    default-timeout-ms: 30000
    default-retry-limit: 2

  kafka:
    topics:
      incident-created: incident.created
      incident-assigned: incident.assigned
      incident-analyzed: incident.analyzed
      remediation-requested: remediation.requested
      remediation-started: remediation.started
      remediation-completed: remediation.completed
      remediation-failed: remediation.failed
      incident-resolved: incident.resolved
      incident-escalated: incident.escalated
      dead-letter: servicedesk.dlt

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"

  level:
    com.servicedesk: ${LOG_LEVEL:INFO}
